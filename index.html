<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Renta Alta · CRM 360</title>
    <meta
      name="description"
      content="Prototipo de gestión de clientes, campañas y carteras de Renta Alta."
    />
    <meta name="theme-color" content="#00803f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300803f'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='13' font-weight='bold' fill='%23fff' text-anchor='middle'%3E360%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="design.css" />
    <link rel="stylesheet" href="sistema.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Ir al contenido principal</a>
    <aside>
      <a class="brand" href="#inicio"
        ><span class="brandmark">360</span> Conecta<span class="brand-sub">RENTA ALTA</span></a
      >
      <div class="workspace">ESPACIO COMERCIAL</div>
      <nav id="nav" aria-label="Secciones del CRM"></nav>
      <div class="side-bottom">
        <span class="avatar">CM</span>
        <div><b id="person">Camila Mendoza</b><small id="job">Ejecutiva Senior</small></div>
      </div>
    </aside>
    <div class="shell">
      <header>
        <div class="crumb">Canales comerciales <span>/</span> <b>Renta Alta</b></div>
        <div class="header-actions">
          <button
            id="notificationBell"
            class="bell"
            aria-label="Notificaciones"
            onclick="location.hash = 'notificaciones'"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
            </svg>
            <span>Notificaciones</span><b id="unreadCount">0</b>
          </button>
          <div class="role">
            <span>Ver como</span
            ><select id="role" aria-label="Perfil">
              <option value="exec">Ejecutivo</option>
              <option value="sup">Supervisor</option>
              <option value="admin">Administrador</option></select
            ><select id="activeExecutive" aria-label="Ejecutivo de demostración"></select
            ><select id="activeSupervisor" aria-label="Supervisor de demostración"></select>
          </div>
        </div>
      </header>
      <div class="workarea">
        <main id="main" tabindex="-1"></main>
        <section id="portfolioRail" aria-label="Gestión de cartera"></section>
      </div>
      <footer>Prototipo interactivo · Datos ficticios · Los cambios duran esta sesión</footer>
    </div>
    <dialog id="dialog"><div id="modal"></div></dialog>
    <div id="toast" role="status"></div>
    <script src="app.js"></script>
    <script src="experience.js"></script>
    <script src="campaign-workspace.js"></script>
    <script src="attention-workspace.js"></script>
    <script src="reference-layout.js"></script>
    <script src="campaign-scale.js"></script>
    <script src="etapa8.js"></script>
    <script src="etapa9.js"></script>
    <script src="etapa10.js"></script>
    <script src="etapa11.js"></script>
    <script src="etapa12.js"></script>
    <script src="etapa13.js"></script>
  </body>
</html>
